name: eval

# Behavioral eval with an LLM. Runs nightly and on demand, only when the repository has an
# ANTHROPIC_API_KEY secret; without it the job is skipped, not failed. Results are uploaded
# as an artifact; update tests/eval/baseline.json by hand after reviewing them.

on:
  workflow_dispatch:
    inputs:
      cases:
        description: "Danh sách id ca, cách nhau bằng dấu phẩy (để trống = tất cả)"
        required: false
        default: ""
  schedule:
    - cron: "0 19 * * *" # 02:00 giờ Việt Nam

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check for API key
        id: key
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::ANTHROPIC_API_KEY chưa được cấu hình, bỏ qua eval"; fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 22
      - name: Install Claude Code
        if: steps.key.outputs.present == 'true'
        run: npm install -g @anthropic-ai/claude-code
      - name: Run eval
        if: steps.key.outputs.present == 'true'
        env:
          CASES: ${{ github.event.inputs.cases }}
        run: |
          args=(--judge --concurrency 3 --out tests/eval/results/ci.json --compare tests/eval/baseline.json)
          if [ -n "${CASES:-}" ]; then args+=(--cases "$CASES"); fi
          # A single nondeterministic case can flip between runs; report a regression as a warning.
          node tests/eval/run-eval.mjs "${args[@]}" || echo "::warning::Eval có ca tụt so với baseline hoặc lỗi khi chạy; xem artifact eval-results"
      - name: Upload results
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: tests/eval/results/
          if-no-files-found: ignore
