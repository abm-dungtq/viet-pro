name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deterministic:
    name: deterministic (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -S warning install.sh tests/run-all.sh tests/install/test-install.sh
      - name: Install Claude Code CLI for manifest validation
        run: npm install -g @anthropic-ai/claude-code
      - name: Deterministic checks
        run: bash tests/run-all.sh
